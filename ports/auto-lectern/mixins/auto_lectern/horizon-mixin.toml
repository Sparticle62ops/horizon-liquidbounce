[mod]
id = "auto_lectern"
version = "1.0.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "auto_lectern"
source = "runtime.rs"

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "movement"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_movement_input"
helper = "movement.rs"
bindings = [
  { name = "forward", ty = "&mut f32", value = "forward" },
  { name = "strafe", ty = "&mut f32", value = "strafe" },
  { name = "jump", ty = "&mut bool", value = "jump" },
  { name = "sneak", ty = "&mut bool", value = "sneak" },
]
