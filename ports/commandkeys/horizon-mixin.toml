[mod]
id = "commandkeys"
version = "1.0.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "commandkeys"
source = "runtime.rs"

[[injection]]
id = "commandkeys-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "commandkeys-keys"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "key_name", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]
