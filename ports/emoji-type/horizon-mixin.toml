[mod]
id = "emoji_type"
version = "1.0.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "emoji_type"
source = "runtime.rs"

[[injection]]
id = "replace-emoji-codes-chat"
kind = "WRAP_OPERATION"
target = "horizon_client::game::remote::Game<'_>::send_chat"
helper = "chat_send.rs"
selector = "self.send_signed_chat"
require = 1
ordinal = 0
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "$receiver" },
  { name = "message", ty = "&str", value = "$arg0" },
  { name = "original", ty = "impl FnOnce(&mut Game<'_>, &str) -> ()", value = "$operation" },
]

[[injection]]
id = "replace-emoji-codes-command"
kind = "WRAP_OPERATION"
target = "horizon_client::game::remote::Game<'_>::send_chat"
helper = "chat_command.rs"
selector = "self.send_command"
require = 1
ordinal = 0
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "$receiver" },
  { name = "command", ty = "&str", value = "$arg0" },
  { name = "original", ty = "impl FnOnce(&mut Game<'_>, &str) -> ()", value = "$operation" },
]
