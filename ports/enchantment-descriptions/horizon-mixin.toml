[mod]
id = "enchantment_descriptions"
version = "1.0.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "27b9d342ff5effd3a1db11779beb4a8274fb0b04"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "enchantment_descriptions"
source = "runtime.rs"

[[injection]]
id = "tooltip"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip"
helper = "desc.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&crate::mod_api::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(crate::text::Text, u32)>", value = "lines" },
]
