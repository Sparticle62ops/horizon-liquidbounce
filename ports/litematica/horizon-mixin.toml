[mod]
id = "litematica"
version = "0.1.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "764df32826a7f9997c4661f7a8df564f750a8986"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "litematica"
source = "runtime.rs"

[[injection]]
id = "world_primitives"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_primitives"
helper = "primitives.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "[f64; 3]", value = "camera" },
  { name = "primitives", ty = "&mut crate::world_primitives::WorldPrimitives", value = "primitives" },
]

[[crate]]
id = "litematica_mod"
path = "crates/litematica_mod"
dependent = "horizon-client"

[[injection]]
id = "command_handle"
kind = "HEAD"
hook = "command"
hook_version = 1
helper = "command_hook.rs"
bindings = [
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
[[injection]]
id = "level_tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "tick_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]
[[injection]]
id = "input_key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_input_key"
helper = "key_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "event", ty = "&winit::event::KeyEvent", value = "event" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
]
[[injection]]
id = "screen_render_post"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "menu_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client_render::hud::HudBatch", value = "batch" },
  { name = "screen", ty = "&crate::mod_api::NativeScreenView<'_>", value = "screen" },
]
